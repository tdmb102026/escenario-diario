      <p class="hint" id="gen-err" hidden></p></div>`;
  }else if(p===4){
    cuerpo=`<div class="card stack"><p class="eyebrow">Tu historia · ${esc(f.historia.tipo||"")}</p><h2>${esc(f.historia.titulo)}</h2>${vistaTexto(f.historia)}</div>
    <div class="card stack"><h3>Ahora la unimos a tu discurso</h3><p class="muted">Claude pone la historia en la mejor parte y ajusta el discurso para que todo se conecte.</p>
      <button class="siguiente" style="align-self:flex-start" id="f-unir" onclick="flujoUnir()">Unir historia y discurso</button>
      <div class="row"><button onclick="irPaso(3)">Cambiar algo de la historia</button></div>
      <p class="hint" id="gen-err" hidden></p></div>`;
  }else if(p===5){
    cuerpo=`<div class="card stack"><p class="eyebrow">Discurso final</p><h2>${esc(f.final.titulo)}</h2><p class="muted">${esc(f.final.resumen)}</p>
      ${f.final.recomendacion?`<div class="coach"><b>Dónde quedó tu historia</b><p>${esc(f.final.recomendacion)}</p></div>`:""}${vistaTexto(f.final)}</div>
    <div class="card stack"><button class="siguiente" style="align-self:flex-start" onclick="flujoGuardar('final')">${ICON.check}Guardar y practicar</button>
      <div class="row"><button id="f-unir" onclick="flujoUnir()">Unir de otra forma</button></div><p class="hint" id="gen-err" hidden></p></div>`;
  }
  return `<div class="stack-lg">
  ${crearTabs("flujo")}
  <div class="section-title"><p class="eyebrow">Crear · paso ${p} de 5</p><h1>${["Cuéntale tu idea a Claude","Revisa tu discurso","Encuentra tu historia","Revisa tu historia","Tu discurso con historia"][p-1]}</h1></div>
  ${stepper(p,maxPaso(f))}
  <div id="flujo-cuerpo" class="stack-lg">${cuerpo}</div>
  <details class="lesson"><summary><h3>Otras opciones</h3></summary><div class="lesson-body">
    <button onclick="if(this.dataset.c){flujoSet(flujoVacio());render()}else{this.dataset.c=1;this.textContent='Toca otra vez para borrar este discurso y empezar'}">Empezar un discurso nuevo</button>
    <button onclick="store.set('crearModo','unir');render()">Unir una historia que ya guardé con otro discurso</button>
  </div></details>
  </div>`;
}
function textoRecs(recs){
  const r=recs[0]||{};
  return `Para tu discurso te recomiendo una historia de tipo "${r.tipo||"momento de decisión"}", en ${r.donde||"el cierre"}. ${(r.preguntas||[]).join(" ")} Cuéntamela como te salga.`;
}
function cargando(msg){const c=document.getElementById("flujo-cuerpo");if(c)c.insertAdjacentHTML("beforeend",`<div class="card" id="f-carga"><p class="muted">${msg}</p></div>`)}
function quitarCarga(){document.getElementById("f-carga")?.remove()}

async function flujoEnviar(){
  if(genBusy)return; stopRec();
  const ta=document.getElementById("gen-text"),txt=ta.value.trim();
  if(!txt){genErr("Primero habla o escribe algo.");return}
  if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  const f=flujo(),turns=f.paso===1?f.turnsD:f.turnsH;
  if(f.paso===3&&!turns.length&&f.recs)turns.push({role:"assistant",content:textoRecs(f.recs)});
  turns.push({role:"user",content:txt});flujoSet(f);vaciarDict("gen-text");genErr("");
  document.getElementById("chat").innerHTML=chatDe(turns,"")+'<div class="msg cl">Pensando…</div>';
  genBusy=true;
  try{
    const reglas=f.paso===1?GEN_RULES:HIST_RULES+`\n\nEl discurso de la persona se llama "${f.draft.titulo}": ${f.draft.resumen}. La historia debe conectar con esa idea.`;
    const saludo=f.paso===1?MODOS.discurso.saludo:MODOS.historia.saludo;
    const text=await IA.texto([{role:"user",content:reglas},{role:"assistant",content:"Entendido. "+saludo},...turns.slice(-16)],{rapido:true,tarea:"conversar"});
    turns.push({role:"assistant",content:text});flujoSet(f);
  }catch(e){genBusy=false;render();genErr(aiErr(e));return}
  genBusy=false;render();
}
async function flujoArmar(){
  if(genBusy)return; stopRec();
  const f=flujo(),esHist=f.paso===3,turns=esHist?f.turnsH:f.turnsD;
  const pend=document.getElementById("gen-text").value.trim();if(pend)turns.push({role:"user",content:pend});
  if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  genBusy=true;genErr("");document.getElementById("gen-build").disabled=true;
  cargando(`Claude está escribiendo tu ${esHist?"historia":"discurso"}. Puede tardar hasta un minuto…`);
  const convo=turns.map(t=>(t.role==="user"?"PERSONA: ":"COACH: ")+t.content).join("\n");
  const prev=(esHist?f.historia:f.draft)?"\n\nBORRADOR ANTERIOR (aplica los cambios que la persona pidió después de él):\n"+JSON.stringify(esHist?f.historia:f.draft):"";
  try{
    if(esHist){
      const d=await IA.json(promptHistoria(convo,prev),{tarea:"historia"});
      f.historia=limpiarBorrador(d,{kind:"historia",tipo:String(d.tipo||"Historia"),tema:"Historia",cierre:"Storytelling",nivel:2});
      f.final=null;f.paso=4;
    }else{
      const d=await IA.json(promptDiscurso(convo,prev),{tarea:"armar"});
      f.draft=limpiarBorrador(d,{nivel:1});f.recs=null;f.turnsH=[];f.historia=null;f.final=null;f.paso=2;
    }
    f[esHist?"turnsH":"turnsD"]=turns;flujoSet(f);genBusy=false;render();
  }catch(e){genBusy=false;quitarCarga();document.getElementById("gen-build").disabled=false;genErr(aiErr(e))}
}
async function flujoRecomendar(){
  if(genBusy)return;
  const f=flujo();if(f.recs){f.paso=3;flujoSet(f);render();return}
  if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  genBusy=true;document.getElementById("f-recs").disabled=true;cargando("Claude está pensando qué historia le va a tu discurso…");
  try{
    f.recs=await recomendarHistoria(f.draft);f.paso=3;flujoSet(f);genBusy=false;render();
  }catch(e){genBusy=false;quitarCarga();document.getElementById("f-recs").disabled=false;genErr(aiErr(e))}
}
async function flujoUnir(){
  if(genBusy)return;
  const f=flujo();if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  genBusy=true;document.getElementById("f-unir").disabled=true;cargando("Claude está uniendo tu historia con tu discurso…");
  try{
    f.final=await unirTextos(f.draft,f.historia);f.paso=5;flujoSet(f);genBusy=false;render();
  }catch(e){genBusy=false;quitarCarga();document.getElementById("f-unir").disabled=false;genErr(aiErr(e))}
}
function flujoGuardar(cual){
  const f=flujo(),t=Date.now();
  const nuevos=[];
  if(cual==="final"){nuevos.push({...f.final,id:"m"+t,mio:true});if(f.historia)nuevos.push({...f.historia,id:"m"+(t+1),mio:true})}
  else nuevos.push({...f.draft,id:"m"+t,mio:true});
  nuevos.forEach(x=>delete x.recomendacion);
  store.set("mine",[...nuevos,...store.get("mine",[])]);
  flujoSet(flujoVacio());toast(cual==="final"?"Guardados tu discurso y tu historia":"Discurso guardado");location.hash="d-"+nuevos[0].id;
}

/* ================= ROUTER ================= */
function render(){
  stopSpeech(); stopRec(true); clearInterval(aiInt); cronoParar(); guiaCerrar(); cerrarEnsayo(); impFase="";
  if(guiada||document.getElementById("guiada")){guiada=null;document.getElementById("guiada")?.remove();document.getElementById("prompter")?.remove()}
  const h=(location.hash||"#inicio").slice(1);
  let html, tab=h;
  if(h.startsWith("d-")){html=viewDiscurso(h.slice(2));tab="discursos"}
  else if(h.startsWith("evaluar-")){html=viewEvaluar(h.slice(8));tab="discursos"}
  else if(h.startsWith("editar-")){html=viewEditar(h.slice(7));tab="discursos"}
  else html=({inicio:viewInicio,hoy:viewHoy,aprender:viewAprender,discursos:viewDiscursos,crear:viewCrear,ajustes:viewAjustes,improvisar:viewImprovisar,preguntas:viewPreguntas,calentar:viewCalentar,progreso:viewProgreso,nervios:viewNervios}[h]||viewInicio)();
  if(h==="nervios")tab="calentar"; if(h==="hoy")tab="inicio"; if(h==="improvisar"||h==="preguntas")tab="discursos";
  app.innerHTML=html;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
