<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escenario Diario</title>
<meta name="theme-color" content="#141B26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: app de una columna para móvil, barra de pestañas fija abajo, foco tipo "luz de escenario" sobre el contenido activo */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141B26; --muted:#5A6576; --line:#DCE1E8;
  --accent:#B4590F; --accent-soft:#FBEBDD; --spot:#F2B33D; --good:#2E7D4F; --bad:#B23A3A;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#18202B; --ink:#EEF1F5; --muted:#9AA5B5; --line:#2A3443;
  --accent:#F0A35A; --accent-soft:#2E2318; --spot:#F2B33D; --good:#5CC48A; --bad:#EA7A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#18202B; --ink:#EEF1F5; --muted:#9AA5B5; --line:#2A3443;
  --accent:#F0A35A; --accent-soft:#2E2318; --spot:#F2B33D; --good:#5CC48A; --bad:#EA7A7A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
main{max-width:680px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
button,.btn{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:44px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn-accent{color:#1A1006}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-accent{color:#1A1006}}
button:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--ink);color:var(--bg);padding:26px 20px 22px}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--spot) 0%,transparent 65%);opacity:.35;pointer-events:none}
.hero h1{position:relative;color:var(--bg)}
.hero p{position:relative;color:var(--bg);opacity:.85;margin-top:8px;max-width:46ch}
.hero .eyebrow{color:var(--spot);position:relative}
.today{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.today button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.today button.go{background:var(--spot);color:#1A1006;border-color:var(--spot)}

/* Rutina */
.routine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:r}
.routine a{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.82rem;min-width:0}
.routine a b{font-family:var(--f-display);font-size:1.05rem}
.routine a span{color:var(--muted)}
@media (max-width:440px){.routine{grid-template-columns:repeat(2,1fr)}}

/* Lecciones */
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.lesson summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:baseline}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary .n{font-family:var(--f-display);font-weight:800;color:var(--accent);min-width:1.6em}
details.lesson summary h3{flex:1}
details.lesson summary::after{content:"+";font-weight:700;color:var(--muted)}
details.lesson[open] summary::after{content:"–"}
.lesson-body{padding:0 18px 18px 18px;display:flex;flex-direction:column;gap:10px}
.lesson-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* Estructura visual */
.struct{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:6px}
.struct div{padding:8px 0 8px 16px;position:relative}
.struct div::before{content:"";position:absolute;left:-8px;top:15px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.struct b{font-family:var(--f-display)}

/* Biblioteca */
.speech-card{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border-radius:var(--r);padding:18px;align-items:stretch}
.speech-card:hover{border-color:var(--accent)}
.speech-card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:500}
.speech-card h3{font-size:1.2rem}
.speech-card p{font-weight:400;color:var(--muted)}
.done-mark{color:var(--good);font-weight:700}

/* Lector */
.reader-head{display:flex;flex-direction:column;gap:8px}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.toolbar button{padding:8px 12px;min-height:40px;font-size:.88rem}
.seg{margin:0;display:flex;flex-direction:column;gap:6px;padding:14px 0 14px 16px;border-left:3px solid var(--line);transition:border-color .2s, background .2s}
.seg .tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.seg p{font-family:var(--f-read);font-size:1.18rem;line-height:1.7;max-width:62ch}
.seg.active{border-left-color:var(--spot);background:linear-gradient(90deg,var(--accent-soft),transparent 80%)}
.seg.active .tag{color:var(--accent)}
.pause{color:var(--accent);font-weight:600;padding:0 2px}
.coach{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.coach b{color:var(--accent)}
.rate{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.rate input{accent-color:var(--accent)}

/* Teleprompter */
.prompter{position:fixed;inset:0;z-index:50;background:#0B0E13;color:#F4F1EC;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.prompter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #263040}
.prompter-bar button{background:#1B2330;color:#F4F1EC;border-color:#2C3747;min-height:40px;padding:8px 14px}
.prompter-bar .clock{font-family:var(--f-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;margin-left:auto;color:#F2B33D}
.prompter-text{flex:1;overflow-y:auto;padding:40vh max(20px,env(safe-area-inset-right,0px)) 60vh max(20px,env(safe-area-inset-left,0px));font-family:var(--f-read);font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.6;max-width:900px;margin:0 auto;width:100%}
.prompter-text .ptag{display:block;font-family:var(--f-body);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#F2B33D;margin-top:1.4em}
.prompter-text .pause{color:#F2B33D}
.prompter-bar label{font-size:.85rem;display:flex;gap:6px;align-items:center;color:#B8C0CC}
.prompter-bar input{accent-color:#F2B33D;width:90px}

/* Evaluación */
.crit{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .q{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.crit .q small{color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{justify-content:center;padding:8px 0;border-radius:10px;min-height:42px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.score-big{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
textarea,input[type=text],select{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink)}
.history{display:flex;flex-direction:column;gap:0}
.history .h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.history .h:last-child{border-bottom:0}
.history .h .d{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.history .h .t{min-width:0}
.history .h .s{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}

/* Ejercicios */
.ex{display:flex;flex-direction:column;gap:10px}
.ex .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .dur{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.ex .tw{font-family:var(--f-read);font-style:italic;background:var(--accent-soft);padding:10px 12px;border-radius:10px}
.runner{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.runner .in{max-width:680px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.runner .tm{font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;color:var(--spot)}
.runner .lbl{flex:1;min-width:0;font-size:.92rem}
.runner button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:40px}

/* Respiración */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--spot),var(--accent));transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center;color:#1A1006;font-weight:700;font-family:var(--f-display);max-width:100%}
.orb.big{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:0}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.62rem;font-weight:600;min-width:0;letter-spacing:-.01em}
nav.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.section-title{display:flex;flex-direction:column;gap:6px}
.back{align-self:flex-start;padding:6px 12px;min-height:36px;font-size:.9rem}
.dict{display:flex;flex-direction:column;gap:8px}
.dict textarea{font-family:var(--f-read);font-size:1.05rem;line-height:1.6}
.dict .hint{font-size:.88rem;color:var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:10px}
.rec-on{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.cl{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-res{display:flex;flex-direction:column;gap:10px}
.ai-res .pt{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ai-res .pt b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.live{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pestanas button{border:0;border-radius:999px;min-height:40px;background:transparent;font-weight:600;color:var(--muted)}
.pestanas button[aria-selected="true"]{background:var(--accent);color:#fff}
.herramientas{display:flex;flex-wrap:wrap;gap:8px}
.herramientas button{padding:8px 12px;min-height:40px;font-size:.88rem}
.guiada-go{align-self:stretch;min-height:54px;font-size:1.05rem;justify-content:center}
.guiada{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.gd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.gd-x{width:44px;height:44px;border-radius:50%;padding:0;font-size:1.1rem;flex:none}
.gd-pasos{display:flex;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.gd-pasos span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.gd-pasos span.ahora{background:var(--accent);border-color:var(--accent);color:#fff}
.gd-pasos span.hecho{background:var(--good);border-color:var(--good);color:#fff}
.gd-cuerpo{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.gd-cuerpo .reader-head .back{display:none}
.gd-bar{display:flex;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.gd-bar button{min-height:48px;flex:1}
.gd-bar button:disabled{opacity:.4}
.pestanas.tres{grid-template-columns:repeat(3,1fr)}
.ocasiones{display:flex;flex-wrap:wrap;gap:8px}
.ocasiones button{min-height:38px;padding:6px 14px;border-radius:999px;font-size:.9rem}
.ocasiones button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.niveles-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.niveles-mini button{aspect-ratio:1;max-height:56px;border-radius:50%;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.niveles-mini button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.niveles-mini button.locked{opacity:.45;cursor:default}
.ladder{display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border-radius:var(--r);padding:12px 14px;width:100%;font-weight:400}
.lv.sel{border-color:var(--accent);background:var(--accent-soft)}
.lv.locked{opacity:.55;cursor:default}
.lv-n{font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--accent);min-width:1.2em;text-align:center}
.lv-t{display:flex;flex-direction:column;min-width:0}
.lv-t small{color:var(--muted);font-size:.82rem}
.lv .chip,.lv .done-mark,.lv .muted{font-size:.75rem;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.levelup{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.levelup h2{color:var(--bg)}.levelup .eyebrow{color:var(--spot)}
.levelup .btn-primary{background:var(--spot);color:#1A1006;border-color:var(--spot);align-self:flex-start}
.sube{color:var(--accent);font-weight:700}
.sube::before{content:"↑";font-size:.75em;margin-right:2px;vertical-align:super}
.baja{color:var(--muted);font-style:italic}
.baja::before{content:"↓";font-size:.75em;margin-right:2px;vertical-align:super;font-style:normal}
.prompter-text .sube{color:#F2B33D}.prompter-text .baja{color:#9AA5B5}
.tema{font-family:var(--f-read);font-size:1.35rem;line-height:1.4}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.modos button{border:0;justify-content:center;min-height:40px;padding:6px 8px}
.modos button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.guia{position:fixed;inset:0;z-index:55;background:#0B0E13;color:#F4F1EC;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.guia-in{max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.guia h2{color:#F4F1EC;font-size:1.8rem}.guia .eyebrow{color:#F2B33D}
.g-s{font-family:var(--f-read);font-size:1.35rem;line-height:1.5;min-height:4.5em}
.g-rep{color:#9AA5B5;font-size:.9rem;min-height:1.2em;margin:0}
.g-n{font-family:var(--f-display);font-weight:800;font-size:5rem;line-height:1;color:#F2B33D;font-variant-numeric:tabular-nums;min-height:1em}
.guia button{background:#1B2330;color:#F4F1EC;border-color:#2C3747}
.lesson .chip{margin-left:auto}
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pasos button{width:100%;flex-direction:column;gap:4px;padding:6px 2px;border-radius:12px;min-height:0;border:0;background:transparent;font-size:.68rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.pasos button:disabled{cursor:default;opacity:1}
.pasos .pn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:.9rem}

.pistas{display:flex;flex-direction:column;gap:14px}

.retos{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.retos li.actual{color:var(--ink);font-weight:600}
.retos li:not(.ok):not(.actual){opacity:.6}
.g-vel{display:flex;align-items:center;gap:10px;justify-content:center;color:#B8C0CC;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;font-size:.9rem}

<script>
/* ================= CONTENIDO ================= */
const LESSONS = [
 {t:"Qué es un discurso que funciona", b:`<p>Un buen discurso corto no busca decirlo todo. Busca que el público <b>sienta una cosa, entienda una idea y haga una acción</b>. Si alguien sale recordando una sola frase tuya, ganaste.</p>
 <ul><li><b>Una idea central</b>, que quepa en una frase de 12 palabras o menos.</li><li><b>Un público concreto</b>: ¿quién te escucha y qué le duele o qué quiere?</li><li><b>Una acción final</b>: lo que quieres que hagan al salir.</li></ul>`},
 {t:"La estructura: gancho, presentación, cuerpo y cierre", b:`<div class="struct">
  <div><b>Gancho</b> <span class="muted">(10 a 20 s)</span><br>Rompe la inercia: una pregunta incómoda, un dato, una escena o una frase fuerte. Nunca empieces con "buenas tardes, hoy les voy a hablar de...".</div>
  <div><b>Presentación</b> <span class="muted">(15 a 30 s)</span><br>Quién eres para hablar de esto y qué van a ganar si te escuchan. Es la promesa.</div>
  <div><b>Cuerpo</b> <span class="muted">(1 a 3 min)</span><br>Tres puntos como máximo. Cada punto: idea, ejemplo o historia, y una frase que lo resuma.</div>
  <div><b>Cierre</b> <span class="muted">(20 a 40 s)</span><br>Vuelve al gancho, remata con una historia o una pregunta que se queden pensando, y pide una acción concreta.</div></div>`},
 {t:"Cómo escribir tu propio discurso", b:`<ul>
  <li><b>Empieza por el final.</b> Escribe primero la frase de cierre; todo lo demás debe llevar hacia ella.</li>
  <li><b>Escribe como hablas.</b> Frases cortas. Palabras de todos los días. Si no lo dirías en una plática, bórralo.</li>
  <li><b>Usa la regla de tres.</b> Tres puntos, tres ejemplos, tres palabras. El cerebro recuerda en grupos de tres.</li>
  <li><b>Cuenta historias con un momento exacto.</b> "Era martes, 6 de la mañana, y yo estaba..." pesa más que "una vez me pasó...".</li>
  <li><b>Habla en segunda persona.</b> "Tú" conecta más que "la gente".</li>
  <li><b>Lee en voz alta y corta.</b> Cada vez que te trabes al leer, simplifica esa frase.</li></ul>`},
 {t:"Cómo preparar y ensayar", b:`<ul>
  <li><b>No memorices palabra por palabra.</b> Memoriza el gancho, el cierre y el orden de los puntos. Lo de en medio, cuéntalo.</li>
  <li><b>Marca las pausas.</b> En esta app verás <span class="pause">/</span> donde conviene respirar o dejar que la idea caiga.</li>
  <li><b>Ensaya en tres rondas:</b> 1) lee en voz alta, 2) dilo mirando el texto solo de vez en cuando, 3) dilo de pie, sin texto, como si hubiera público.</li>
  <li><b>Grábate.</b> Escucharte es incómodo y por eso funciona. Busca muletillas, velocidad y volumen.</li>
  <li><b>Practica de pie.</b> Tu cuerpo aprende la postura junto con las palabras.</li></ul>`},
 {t:"Voz, cuerpo y mirada", b:`<ul>
  <li><b>Volumen:</b> habla para la última fila, no para la primera.</li>
  <li><b>Velocidad:</b> lo normal son unas 130 a 150 palabras por minuto. Con nervios subimos a 180; baja a propósito.</li>
  <li><b>Pausa:</b> el silencio antes de una idea importante la hace sonar importante.</li>
  <li><b>Mirada:</b> sostén la vista con una persona durante una frase completa y luego cambia a otra zona.</li>
  <li><b>Manos:</b> déjalas visibles y a la altura del ombligo; que acompañen, no que distraigan.</li>
  <li><b>Pies:</b> plantados a la anchura de tus hombros. Muévete solo cuando cambies de idea.</li></ul>`},
 {t:"Felicitaciones, brindis y unas palabras", b:`<p>En un cumpleaños, una boda, una despedida o cuando alguien logra algo, te pueden pedir "unas palabras" sin aviso. El secreto: <b>no felicites con adjetivos, felicita con un recuerdo</b>. "Eres una gran persona" se olvida; "Recuerdo cuando estábamos trabajando en…" se queda.</p>
 <div class="struct">
  <div><b>1. Atención</b> <span class="muted">(5 s)</span><br>Ponte de pie, levanta la copa o espera el silencio. "Quiero decir unas palabras para Ana."</div>
  <div><b>2. El recuerdo</b> <span class="muted">(30 a 60 s)</span><br>Una historia corta con un momento exacto: "Recuerdo cuando estábamos tú y yo en la bodega, a las once de la noche, sacando el pedido…". Qué pasó y qué hizo esa persona.</div>
  <div><b>3. Lo que eso dice de ella</b> <span class="muted">(10 a 20 s)</span><br>"Eso llevó a…", "Ese día entendí que tú…". De la historia sale la cualidad, sin que tengas que adornarla.</div>
  <div><b>4. El deseo o el brindis</b> <span class="muted">(10 s)</span><br>Mira a la persona, luego a todos: "Por eso hoy te deseo… ¡Salud por Ana!"</div></div>
 <p><b>La fórmula para recordarla:</b> <i>Recuerdo cuando… → eso llevó a… → por eso hoy te deseo… → ¡salud!</i></p>
 <ul>
  <li><b>Cumpleaños:</b> un recuerdo con la persona y lo que te enseñó. "Recuerdo cuando me prestaste tu carro sin preguntar para qué…"</li>
  <li><b>Brindis de boda o aniversario:</b> un recuerdo de la pareja juntos, no de tu amistad con uno solo. Termina invitando a todos a levantar la copa.</li>
  <li><b>Un logro (graduación, ascenso, negocio nuevo):</b> cuenta un momento del esfuerzo que nadie vio. "Yo la vi estudiar en el bus a las seis de la mañana."</li>
  <li><b>Despedida o agradecimiento:</b> un momento en que esa persona hizo la diferencia para ti o para el grupo.</li></ul>
 <ul>
  <li><b>Corto gana:</b> uno a dos minutos. Nadie se queja de un brindis breve.</li>
  <li><b>Que lo entiendan todos:</b> nada de chistes internos ni anécdotas que avergüencen.</li>
  <li><b>La protagonista es la otra persona,</b> no tú: usa más "tú" que "yo".</li>
  <li><b>Ten una lista mental de recuerdos</b> de la gente cercana. Cuando te pidan palabras, ya tienes la historia.</li></ul>
 <a class="btn btn-accent" href="#crear" onclick="store.set('crearModo','ocasion')" style="align-self:flex-start">Crear un brindis o una felicitación</a>`},
];

 {id:"programa", titulo:"El programa que corre en silencio", tema:"Subconsciente", min:3, cierre:"Storytelling",

/* ================= IA =================
   En el teléfono la IA va por tu servidor (Apps Script hoy, Railway mañana) con tu clave de API:
   la app manda { clave, tipo: "probar" | "ia", tarea, mensajes, max } y recibe { ok, texto }.
   Si la página se abre como artefacto dentro de Claude, usa la cuenta de Claude de quien la mira. */
async function getSample(){try{return window.claude?await window.claude.use("sample"):null}catch(e){return null}}
const IA={
  conf(){return store.get("ia",{url:"",clave:""})},
  listo(){const c=this.conf();return !!(window.claude||(c.url&&c.clave))},
  async texto(mensajes,{rapido,tarea,max}={}){
    const s=await getSample();
    if(s){const {text}=await s(mensajes,{cache:false,modelTier:rapido?"quick":"default"});return text}
    return servidor({tipo:"ia",tarea:tarea||"",mensajes:typeof mensajes==="string"?[{role:"user",content:mensajes}]:mensajes,max:max||(rapido?700:2500)});
  },
  // Las historias traen diálogos; unas comillas sin escapar rompían el JSON ("La respuesta llegó incompleta").
  // Por eso se piden « » para citas, se repara lo que se pueda y, si aún falla, se pide una vez más.
  async json(prompt,{tarea}={}){
    prompt+=REGLA_COMILLAS;
    const s=await getSample();
    if(s)return s.json(prompt,{cache:false});
    try{return leerJson(await this.texto(prompt,{tarea,max:3000}))}
    catch(e){if(e.code!=="invalid_json")throw e;return leerJson(await this.texto(prompt,{tarea,max:3000}))}
  }
};
async function servidor(cuerpo){
  const c=IA.conf(); if(!c.url||!c.clave)throw {code:"sin_config"};
  let r,j;
  try{r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({clave:c.clave,...cuerpo})})}catch(e){throw {code:"sin_red"}}
  // Si el Apps Script no está publicado para "Cualquier persona", Google responde con una página en vez de JSON.
  try{j=await r.json()}catch(e){throw {code:"no_json"}}
  if(!j.ok)throw {code:j.error||"servidor",message:j.detalle||""};
  return j.texto||"";
}
const REGLA_COMILLAS='\n\nIMPORTANTE: el JSON debe ser válido. Dentro de los textos nunca uses comillas dobles ("); para diálogos o citas usa « ».';
function leerJson(t){
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m)try{return JSON.parse(m[1])}catch(e){}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>=0&&b>a){const c=t.slice(a,b+1);try{return JSON.parse(c)}catch(e){}try{return JSON.parse(repararJson(c))}catch(e){}}
  // El detalle (largo y final de la respuesta) ayuda a saber si llegó cortada o con otra forma.
  throw {code:"invalid_json",message:`${t.length} letras, termina en: ${t.slice(-60)}`};
}
// Escapa comillas dentro de los textos: una " solo cierra el texto si después viene , : ] o }.
function repararJson(c){
  let o="",dentro=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(dentro&&ch==="\\"){o+=ch+(c[i+1]||"");i++;continue}
    if(ch==='"'){
      if(!dentro){dentro=true;o+=ch;continue}
      if(/^\s*(?:$|[:\]}]|,\s*["\[{\]])/.test(c.slice(i+1,i+40))){dentro=false;o+=ch}else o+='\\"';
      continue;
    }
    if(dentro&&ch==="\n"){o+="\\n";continue}
    o+=ch;
  }
  return o;
}
function aiErr(e){const c=e&&e.code;return ({
  sin_config:"Falta conectar la IA. Ve a Inicio → Ajustes de la IA.",
  "contraseña":"La contraseña de la app no coincide con la del servidor. Revísala en Ajustes de la IA.",
  "sin-clave-api":"El servidor todavía no tiene tu clave de Anthropic. Guárdala desde el menú de la hoja.",
  "clave-api":"Anthropic rechazó la clave de API. Crea una nueva y guárdala desde el menú de la hoja.",
  saldo:"Se acabó el saldo de tu API de Anthropic. Recarga en console.anthropic.com → Billing.",
  sin_red:"No hay internet. Conéctate y vuelve a intentarlo.",
  no_json:"El servidor no respondió bien. Revisa que el Apps Script esté publicado para \"Cualquier persona\".",
  not_granted:"No diste permiso para usar Claude en esta página.",
  rate_limited:"Demasiadas solicitudes por ahora. Espera un momento y vuelve a intentarlo.",
  session_expired:"Tu sesión de Claude expiró. Vuelve a iniciar sesión.",
  vacio:"Claude no alcanzó a responder. Falta actualizar el servidor de la IA (pega el código nuevo del Apps Script y publica una versión nueva).",
  corto:"La respuesta salió demasiado larga y se cortó. Toca el botón otra vez.",
  invalid_json:"La respuesta llegó incompleta. Toca el botón otra vez."+detalleErr({message:e&&e.message})
})[c]||"No se pudo conectar con la IA. Intenta de nuevo."+detalleErr(e)}
// Para errores raros se muestra el detalle, así se puede saber qué pasó con una captura de pantalla.
function detalleErr(e){const d=e?[e.code,e.message].filter(Boolean).join(": "):"";return d?` (Detalle: ${String(d).slice(0,160)})`:""}

/* Dictado: usa el reconocimiento de voz si existe; si no, el micrófono del teclado */
let rec=null;
// En la app Android, AndroidVoz escucha con el reconocimiento de Google sin ventanita y sin cortarse en las pausas.
const NATIVO=window.AndroidVoz||null;
let dictId=null,dictBase="",dictFinal="";
function micBtnIdle(id){const b=document.getElementById(id+"-mic");if(b){b.classList.remove("rec-on");b.innerHTML=ICON.mic+"Hablar"}}
// Al detener, Android aún entrega lo último que oyó; dictId se limpia cuando avisa "detenido" (o al cambiar de pantalla).
function stopRec(salir){if(rec){try{rec.stop()}catch(e){}rec=null}if(NATIVO&&dictId){NATIVO.detener();micBtnIdle(dictId);if(salir)dictId=null}}
// Google reinicia la escucha en cada pausa. Si una tanda termina sin resultado final (o en error), lo último
// que se oyó (dictParcial) se guarda igual; si no, la tanda nueva lo borraba de la caja.
let dictParcial="";
function dictMostrar(){const ta=dictId&&document.getElementById(dictId);if(ta){ta.value=dictBase+dictFinal+dictParcial;ta.scrollTop=ta.scrollHeight;medirVivo(dictId)}}
function tandaNueva(a,b){const wa=a.trim().split(/\s+/),wb=b.trim().split(/\s+/);return wa.length>=3&&wb.length<wa.length-1&&wa[0].toLowerCase()!==wb[0].toLowerCase()}
const Dictado={
  parcial(t){if(dictParcial&&tandaNueva(dictParcial,t))dictFinal+=dictParcial+" ";dictParcial=t;dictMostrar()},
  final(t){t=t||dictParcial;dictParcial="";if(t)dictFinal+=t+" ";dictMostrar()},
  estado(s){if(s==="escuchando")return;if(dictParcial){dictFinal+=dictParcial+" ";dictParcial="";dictMostrar()}if(dictId)micBtnIdle(dictId);dictId=null;if(s.indexOf("error:")===0)toast(s.slice(6))}
};
// Deja la caja vacía y corta el dictado de esa caja: si no, Android seguía escribiendo lo anterior después de Enviar.
function vaciarDict(id){
  if(dictId===id){if(NATIVO){NATIVO.detener();micBtnIdle(id)}dictId=null}
  if(rec){rec.onresult=null;rec.onend=null;try{rec.stop()}catch(e){}rec=null;micBtnIdle(id)}
  dictBase=dictFinal=dictParcial="";const ta=document.getElementById(id);if(ta)ta.value="";dictT0[id]=0;medirVivo(id);
}
// Borrar texto sin cortar el dictado si está escuchando.
function borrarDict(id){if(dictId===id){dictBase=dictFinal=dictParcial=""}const ta=document.getElementById(id);if(ta)ta.value="";dictT0[id]=0;medirVivo(id)}
function dictBox(id,ph,rows){return `<div class="dict"><textarea id="${id}" rows="${rows||5}" placeholder="${esc(ph)}"></textarea>
 <div class="row"><button type="button" id="${id}-mic" onclick="startRec('${id}')">${ICON.mic}Hablar</button><button type="button" onclick="borrarDict('${id}')">Borrar texto</button></div>
 <div class="vivo" id="${id}-vivo" hidden></div>
 <p class="hint" id="${id}-hint" hidden>Este navegador no deja usar el micrófono aquí. Toca el ícono de micrófono de tu teclado y habla: tu teléfono escribirá lo que digas. Con la app Android esto no hace falta.</p></div>`}
function startRec(id){
  const ta=document.getElementById(id),btn=document.getElementById(id+"-mic"),hint=document.getElementById(id+"-hint");
  const fallback=()=>{rec=null;btn.classList.remove("rec-on");btn.innerHTML=ICON.mic+"Hablar";hint.hidden=false;ta.focus()};
  if(!ta.value.trim()||!dictT0[id])dictT0[id]=Date.now();
  if(NATIVO){
    if(dictId){stopRec();return}
    dictId=id;dictBase=ta.value?ta.value.trim()+" ":"";dictFinal="";dictParcial="";
    btn.classList.add("rec-on");btn.innerHTML=ICON.stop+"Detener";hint.hidden=true;
    NATIVO.escuchar();return;
  }
  if(rec){rec.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){fallback();return}
  try{
    rec=new SR();rec.lang="es-EC";rec.continuous=true;rec.interimResults=true;
    const base=ta.value?ta.value.trim()+" ":"";let failed=false;
    rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;ta.value=base+t;medirVivo(id)};
    rec.onerror=()=>{failed=true;fallback()};
    rec.onend=()=>{if(!failed){rec=null;btn.classList.remove("rec-on");btn.innerHTML=ICON.mic+"Hablar"}};
    rec.start();btn.classList.add("rec-on");btn.innerHTML=ICON.stop+"Detener";
  }catch(e){fallback()}
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
// Discurso del día: del nivel en el que vas (los niveles 4 y 5 practican sobre los del 3).
function todaySpeech(){const d=new Date();const n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);const lv=Math.min(3,typeof nivelActual==="function"?nivelActual():1);const l=SPEECHES.filter(s=>s.nivel===lv);return l[n%l.length]}
function practicedIds(){return new Set(store.get("hist",[]).map(h=>h.id))}

/* ================= VOZ ================= */
let voices=[]; const synth = window.speechSynthesis;
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^es/i.test(v.lang))}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
let speaking=null;
function marcarParte(i){const r=document.getElementById("guiada")||document,l=r.querySelectorAll(".seg");l.forEach((e,k)=>e.classList.toggle("active",k===i));l[i]?.scrollIntoView({behavior:"smooth",block:"center"})}
// La app Android avisa con Voz.parte(i) al empezar cada parte y Voz.fin() al terminar.
const Voz={parte(i){if(speaking)marcarParte(i)},fin(){if(vozCb){vozCb();return}stopSpeech()},sinVoz(){if(vozCb){vozCb();return}stopSpeech();const n=document.getElementById("tts-note");if(n)n.hidden=false}};
// La app Android llama "window.Voz && Voz.fin()" y "window.Dictado && …": un const no queda en window, así que se publican aquí.
window.Voz=Voz;window.Dictado=Dictado;
function stopSpeech(){const habia=!!speaking;if(NATIVO&&speaking)NATIVO.callar();if(synth)synth.cancel();speaking=null;document.querySelectorAll(".seg.active").forEach(e=>e.classList.remove("active"));botonesEscuchar(ICON.play+"Escuchar");if(habia&&guiada&&guiada.paso===1)guiadaMarcar(1)}
function botonesEscuchar(h){document.querySelectorAll("#btn-listen,.btn-listen").forEach(b=>b.innerHTML=h)}
function speakSpeech(sp){
  if(speaking){stopSpeech();return}
  if(NATIVO){
    const partes=[];sp.partes.forEach((p,i)=>trozos(p[1]).forEach(c=>partes.push({i,t:c})));
    speaking=sp.id;botonesEscuchar(ICON.stop+"Detener");
    NATIVO.hablar(JSON.stringify(partes),parseFloat(store.get("rate",0.95)));return;
  }
  if(!synth||!synth.getVoices){const n=document.getElementById("tts-note");if(n){n.hidden=false;n.scrollIntoView({behavior:"smooth",block:"center"})}return}
  if(speaking){stopSpeech();return}
  const rate=parseFloat(store.get("rate",0.95));
  const vName=store.get("voice",""); const voice=voices.find(v=>v.name===vName)||voices.find(v=>/es-(MX|US|419)/i.test(v.lang))||voices[0];
  speaking=sp.id; botonesEscuchar(ICON.stop+"Detener");
  synth.cancel();
  sp.partes.forEach((p,i)=>{
    trozos(p[1]).forEach((chunk,j,arr)=>{
      const u=new SpeechSynthesisUtterance(chunk);
      u.lang=voice?voice.lang:"es-MX"; if(voice)u.voice=voice; u.rate=rate;
      if(j===0)u.onstart=()=>marcarParte(i);
      if(i===sp.partes.length-1&&j===arr.length-1)u.onend=()=>stopSpeech();
      synth.speak(u);
    });
  });
}

/* ================= PRÁCTICA GUIADA =================
   Pantalla aparte con los 5 pasos, uno a la vez, y una barra fija abajo (Anterior / Siguiente paso).
   Cada paso arranca solo: la voz lee, el teleprompter y las tarjetas se abren encima y al tocar
   "Listo, siguiente paso" se pasa al que sigue. La X (o el gesto de atrás) vuelve al discurso.
   ed_pract = {id: {paso, hechos:[...]}} recuerda en qué paso ibas. */
const PASOS_PRACT=[
 {t:"Escuchar",d:"Sigue el texto con la vista mientras la voz lo lee."},
 {t:"Leer en voz alta",d:"De pie, léelo con el teleprompter respetando las pausas. Mejor si lo haces dos veces."},
 {t:"Tarjetas clave",d:"Solo ves cómo empieza cada parte y sus palabras clave. Dilo con tus palabras."},
 {t:"Grabarte",d:"Graba tu voz con solo el comienzo de cada parte y escúchate. Fíjate en una sola cosa para mejorar."},
 {t:"Calificarte",d:"Dilo de memoria mientras el teléfono lo escribe, y Claude te califica."}];
function pract(id){return store.get("pract",{})[id]||{paso:1,hechos:[]}}
function practSet(id,v){const t=store.get("pract",{});t[id]=v;store.set("pract",t)}
function practMarcar(id,n){const v=pract(id);if(!v.hechos.includes(n))v.hechos.push(n);practSet(id,v)}
let guiada=null;
// Abre el discurso y encima la práctica guiada (desde Inicio y la rutina de hoy).
function irGuiada(id){
  const pr=pract(id),n=pr.paso>1&&pr.paso<5?pr.paso:1;
  if((location.hash||"").slice(1)!=="d-"+id){location.hash="d-"+id;setTimeout(()=>abrirGuiada(id,n),60)}
  else abrirGuiada(id,n);
}
function abrirGuiada(id,paso){
  stopSpeech();stopRec();cerrarEnsayo();
  const sp=findSp(id);if(!sp)return;
  document.getElementById("guiada")?.remove();
  const el=document.createElement("div");el.className="guiada";el.id="guiada";
  el.innerHTML=`<div class="gd-top"><div><p class="eyebrow" id="gd-eb"></p><h2 id="gd-t"></h2></div><button class="gd-x" aria-label="Salir de la práctica guiada" onclick="cerrarGuiada()">✕</button></div>
   <div class="gd-pasos" id="gd-pasos"></div>
   <div class="gd-cuerpo" id="gd-cuerpo"></div>
   <div class="gd-bar"><button id="gd-ant">← Anterior</button><button id="gd-sig">Siguiente paso →</button></div>`;
  document.body.appendChild(el);history.pushState({guiada:1},"");
  guiada={id};
  document.getElementById("gd-ant").onclick=()=>guiadaIr(guiada.paso-1);
  document.getElementById("gd-sig").onclick=()=>guiada.paso<5?guiadaIr(guiada.paso+1):cerrarGuiada();
  guiadaIr(paso||1);
}
function guiadaIr(n){
  if(!guiada)return;
  stopSpeech();stopRec();clearInterval(aiInt);
  document.getElementById("prompter")?.remove();
  if(document.getElementById("ensayo"))cerrarEnsayo();
  const id=guiada.id,sp=findSp(id);n=Math.max(1,Math.min(5,n));guiada.paso=n;
  const v=pract(id);v.paso=n;practSet(id,v);
  const P=PASOS_PRACT[n-1],$=x=>document.getElementById(x);
  $("gd-eb").textContent=`Paso ${n} de 5`;$("gd-t").textContent=P.t;
  $("gd-pasos").innerHTML=PASOS_PRACT.map((x,i)=>`<span class="${i+1===n?"ahora":v.hechos.includes(i+1)?"hecho":""}">${v.hechos.includes(i+1)&&i+1!==n?"✓":i+1}</span>`).join("");
  $("gd-ant").disabled=n===1;$("gd-sig").textContent=n<5?"Siguiente paso →":"Terminar";
  $("gd-sig").classList.toggle("siguiente",v.hechos.includes(n));
  const c=$("gd-cuerpo");c.scrollTop=0;
  const otraVez=(txt,fn)=>`<p class="muted">${P.d}</p><button class="btn-primary" style="align-self:flex-start" onclick="${fn}">${txt}</button>`;
  if(n===1){
    c.innerHTML=`<p class="muted">${P.d}</p><button class="btn-listen btn-primary" style="align-self:flex-start" onclick="speakSpeech(findSp('${id}'))">${ICON.play}Escuchar</button><div class="stack" style="gap:4px">${segsHtml(sp)}</div>`;
    speakSpeech(sp);
  }
  // El teleprompter, las tarjetas y la grabadora se abren encima; si los cierras, aquí queda el botón para abrirlos otra vez.
  else if(n===2){c.innerHTML=otraVez(ICON.mic+"Abrir el teleprompter",`openPrompter('${id}',true,true)`);setTimeout(()=>{if(guiada&&guiada.paso===2)openPrompter(id,true,true)},350)}
  else if(n===3){c.innerHTML=otraVez("Abrir las tarjetas",`abrirEnsayo('${id}',1,false,false,true)`);setTimeout(()=>{if(guiada&&guiada.paso===3)abrirEnsayo(id,1,false,false,true)},350)}
  else if(n===4){c.innerHTML=otraVez(ICON.rec+"Abrir la grabadora",`abrirEnsayo('${id}',2,true,false,true)`);setTimeout(()=>{if(guiada&&guiada.paso===4)abrirEnsayo(id,2,true,false,true)},350)}
  else{c.innerHTML=viewEvaluar(id)}
}
function guiadaMarcar(n){if(!guiada)return;practMarcar(guiada.id,n);if(guiada.paso===n)document.getElementById("gd-sig")?.classList.add("siguiente")}
// Al tocar "Listo, siguiente paso" en una herramienta abierta desde la práctica guiada.
function practTerminar(id,n){practMarcar(id,n);if(guiada&&guiada.id===id)guiadaIr(n+1)}
function cerrarGuiada(porAtras){
  const el=document.getElementById("guiada");guiada=null;if(!el)return;

}
// El gesto de atrás: si había una herramienta encima, solo se cierra ella (su estado queda debajo del de la guiada).
window.addEventListener("popstate",()=>{if(document.getElementById("guiada")&&!(history.state&&history.state.guiada))cerrarGuiada(true)});

/* Teleprompter */
let pState=null;
function openPrompter(id,desdePaso,auto){
  stopSpeech();
  const sp=findSp(id);
  const el=document.createElement("div"); el.className="prompter"; el.id="prompter";
  const speed=store.get("pspeed",30);
  el.innerHTML=`<div class="prompter-bar">
    <button id="p-play">${ICON.play}Iniciar</button>
    <button id="p-reset">Reiniciar</button>
    <label for="p-speed">Velocidad <input id="p-speed" type="range" min="10" max="80" value="${speed}"></label>
    <span class="clock" id="p-clock">0:00</span>
    <button id="p-salir">Salir</button>
    <button id="p-close">${desdePaso?"Listo, siguiente paso":"Calificarme"}</button></div>
    <div class="prompter-text" id="p-text">${sp.partes.map(p=>`<span class="ptag">${esc(p[0])}</span>${withPauses(p[1])}`).join(" ")}</div>`;
  document.body.appendChild(el);
  const txt=el.querySelector("#p-text"), clock=el.querySelector("#p-clock"), play=el.querySelector("#p-play"), spd=el.querySelector("#p-speed");
  let wake=null;
  pState={running:false,t:0,last:0,acc:0,raf:0};
  function tick(ts){
    if(!pState.running)return;
    const dt=pState.last?(ts-pState.last)/1000:0; pState.last=ts;
    pState.t+=dt; pState.acc+=dt*parseFloat(spd.value);
    if(pState.acc>=1){const px=Math.floor(pState.acc);txt.scrollTop+=px;pState.acc-=px}
    const s=Math.floor(pState.t); clock.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    pState.raf=requestAnimationFrame(tick);
  }
  play.onclick=async()=>{
    pState.running=!pState.running;
    play.innerHTML=pState.running?ICON.stop+"Pausa":ICON.play+"Seguir";
    if(pState.running){pState.last=0;pState.raf=requestAnimationFrame(tick);try{wake=await navigator.wakeLock?.request("screen")}catch(e){}}
    else{cancelAnimationFrame(pState.raf);try{wake?.release()}catch(e){}}
  };
  if(auto)play.onclick();
  el.querySelector("#p-reset").onclick=()=>{txt.scrollTop=0;pState.t=0;clock.textContent="0:00"};
  spd.oninput=()=>store.set("pspeed",spd.value);
  el.querySelector("#p-salir").onclick=()=>{pState.running=false;cancelAnimationFrame(pState.raf);try{wake?.release()}catch(e){}el.remove()};
  el.querySelector("#p-close").onclick=()=>{
    pState.running=false;cancelAnimationFrame(pState.raf);try{wake?.release()}catch(e){}
    store.set("lastTime",{id,s:Math.round(pState.t)});
    el.remove(); if(desdePaso)practTerminar(id,2); else location.hash="evaluar-"+id;
  };
}

/* Evaluación */

  <div class="card">${CRITERIA.map((c,i)=>`<div class="crit"><div class="q"><h3>${c[0]}</h3></div><small class="muted">${esc(c[1])}</small>
     <div class="scale" role="group" aria-label="${c[0]}">${[1,2,3,4,5].map(n=>`<button aria-pressed="false" data-c="${i}" data-n="${n}" onclick="pick(${i},${n})">${n}</button>`).join("")}</div></div>`).join("")}</div>

    <label for="ev-note"><h3>Una cosa a mejorar mañana</h3></label>

  </div>
  <div class="card row" style="justify-content:space-between">
    <div><p class="eyebrow">Tu calificación</p><p class="score-big" id="ev-score">–</p></div>

  </div></div>`;
}
let aiT0=0,aiInt=null,aiCtl=null;
function aiStart(){
  aiT0=Date.now();clearInterval(aiInt);
  const c=document.getElementById("ai-clock");
  aiInt=setInterval(()=>{const s=Math.floor((Date.now()-aiT0)/1000);if(c)c.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500);
  document.getElementById("ai-start").innerHTML=ICON.play+"Reiniciar";
  startRec("ai-text");
}
let vozPropia=0;
function aiGrade(id){
  const sp=findSp(id),out=document.getElementById("ai-res");
  stopRec();cronoParar();clearInterval(aiInt);
  const dijo=document.getElementById("ai-text").value.trim();
  if(dijo.split(/\s+/).length<15){out.innerHTML='<p class="hint" style="color:var(--bad)">Necesito al menos unas frases de tu discurso para calificarte. Di el discurso mientras el texto se escribe arriba.</p>';return}
  const m=medir(dijo,aiT0),nivel=sp.nivel||1;
  const crits=nivel===2?[...CRIT_DISCURSO.slice(0,5),CRIT_HISTORIA,CRIT_DISCURSO[5]]:CRIT_DISCURSO;
  const guion=sp.partes.map(p=>p[0]+": "+plain(p[1])).join("\n");
  const p=promptCalificar(`GUION ORIGINAL ("${sp.titulo}"):\n${guion}\n\nCompara lo que dijo con este guion; puede parafrasear.`,dijo,m.txt+" (ideal 130 a 150 palabras por minuto)",crits);
  calificar(out,document.getElementById("ai-go"),p,m,{id,nivel,extra:nivel===3&&vozPropia?{"Tu voz":vozPropia}:{}});
}
function pick(i,n){
  evalScores[i]=n;
  document.querySelectorAll(`.scale button[data-c="${i}"]`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.n==n));

  document.getElementById("ev-save").disabled=vals.length<CRITERIA.length;
}
function saveEval(id){
  const vals=CRITERIA.map((_,i)=>evalScores[i]);

  h.unshift({id,nivel:(findSp(id)||{}).nivel||1,date:new Date().toISOString(),scores:vals,score:vals.reduce((a,b)=>a+b,0)/vals.length,

  store.set("hist",h.slice(0,200)); marcarPractica(); practMarcar(id,5); toast("Práctica guardada"); location.hash="progreso";
}
const avg=h=>h.reduce((a,b)=>a+b.score,0)/h.length;
// Racha: cuenta los días con una práctica guardada, un calentamiento completo, una grabación o un reto (fecha del teléfono).
function calcStreak(){
  const days=diasPracticados(); let n=0; const d=new Date();
  if(!days.has(diaLocal(d)))d.setDate(d.getDate()-1);
  while(days.has(diaLocal(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* Crear discurso con Claude */
const GEN_RULES=`Eres un coach de oratoria que ayuda a una persona a crear su propio discurso corto (1 a 3 minutos), con el estilo motivacional y enérgico de Tony Robbins, pero con ideas y palabras originales. Hablas en español de México, cercano y breve (2 a 4 frases por respuesta). La persona te habla por dictado de voz, así que su texto puede venir sin puntuación.
Tu trabajo en esta conversación: entender de qué quiere hablar. Haz UNA sola pregunta a la vez, máximo tres preguntas en total, entre estas: el mensaje central o la idea que quiere dejar, quién es su público, y una historia o experiencia personal que pueda usar en el cierre. Si ya te dio algo, no lo preguntes. Cuando ya tengas suficiente, dile que toque el botón "Armar discurso". Si te pide cambios a un discurso ya armado, confirma brevemente qué vas a cambiar y dile que toque "Armar discurso" otra vez.`;
function genState(){return store.get(MODOS[modoCrear()].key,{turns:[],draft:null})}
function genGuardarEstado(g){store.set(MODOS[modoCrear()].key,g)}
const OCASIONES=["Cumpleaños","Brindis","Boda o aniversario","Felicitar un logro","Despedida o jubilación","Agradecimiento","Bienvenida","Palabras de despedida en un funeral"];
function crearTabs(modo){
  const t=[["flujo","Discurso"],["ocasion","Ocasiones"],["historia","Historia"]];
  return `<div class="pestanas tres" role="tablist">${t.map(([k,n])=>`<button role="tab" aria-selected="${modo===k}" onclick="store.set('crearModo','${k}');render()">${n}</button>`).join("")}</div>`;
}
function elegirOcasion(o){const ta=document.getElementById("gen-text");if(!ta)return;ta.value=o+". Es para ";ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);document.querySelectorAll(".ocasiones button").forEach(b=>b.setAttribute("aria-pressed",b.textContent===o))}
function viewCrear(){
  const modo=store.get("crearModo","flujo");
  if(modo==="flujo"||!MODOS[modo]&&modo!=="unir")return viewFlujo();
  const tabs=modo==="unir"?`<button class="back" onclick="store.set('crearModo','flujo');render()">← Volver al paso a paso</button>`:crearTabs(modo);
  const intro={ocasion:"Para un cumpleaños, un brindis, una felicitación o una despedida. Claude te pregunta por un recuerdo con esa persona y arma unas palabras cortas: recuerdo cuando… eso llevó a… por eso te deseo…",discurso:"Cuéntale a Claude de qué quieres hablar. Te hará un par de preguntas y armará un discurso con gancho, cuerpo y cierre.",historia:"Claude te ayuda a sacar una historia real de tu vida: el momento, el conflicto, el giro y la lección. Luego la puedes unir a cualquier discurso.",unir:"Junta un discurso con una de tus historias. Claude te dice dónde va mejor y por qué."}[modo];
  if(modo==="unir")return `<div class="stack-lg"><div class="section-title"><p class="eyebrow">Crear</p><h1>Unir discurso e historia</h1><p class="muted">${intro}</p></div>${tabs}${viewUnir()}</div>`;
  const M=MODOS[modo],g=genState();
  return `<div class="stack-lg">
  <div class="section-title"><p class="eyebrow">Crear</p><h1>${modo==="historia"?"Tu historia":modo==="ocasion"?"Palabras para una ocasión":"Tu propio discurso"}</h1><p class="muted">${intro}</p></div>
  ${tabs}
  ${modo==="ocasion"&&!g.turns.length?`<div class="stack" style="gap:8px"><p class="eyebrow">¿Para qué ocasión?</p><div class="ocasiones">${OCASIONES.map(o=>`<button type="button" aria-pressed="false" onclick="elegirOcasion('${o}')">${o}</button>`).join("")}</div></div>`:""}
  <section class="chat" id="chat">${chatHtml(g)}</section>
  <section class="card stack">
    ${dictBox("gen-text",g.turns.length?"Tu respuesta…":M.ph,4)}
    <div class="row"><button class="btn-primary" id="gen-send" onclick="genSend()">Enviar</button>
    <button class="btn-accent" id="gen-build" onclick="genBuild()">${M.boton}</button>
    ${g.turns.length?`<button onclick="genReset(this)">Empezar de nuevo</button>`:""}</div>
    <p class="hint" id="gen-err" hidden></p>
  </section>
  <section id="gen-draft">${draftHtml(g.draft,M.key)}</section>
  </div>`;
}
function chatHtml(g){
  if(!g.turns.length)return `<div class="msg cl">${esc(MODOS[modoCrear()].saludo)}</div>`;
  return g.turns.map(t=>`<div class="msg ${t.role==="user"?"me":"cl"}">${esc(t.content)}</div>`).join("");
}
function draftHtml(d,key){
  if(!d)return "";
  return `<div class="card stack"><p class="eyebrow">Borrador · ${esc(d.kind==="historia"?(d.tipo||"Historia"):d.tema)}</p><h2>${esc(d.titulo)}</h2><p class="muted">${esc(d.resumen)}</p>
   ${d.recomendacion?`<div class="coach"><b>Por qué la historia va ahí</b><p>${esc(d.recomendacion)}</p></div>`:""}
   <div class="stack" style="gap:4px">${d.partes.map(p=>`<section class="seg"><span class="tag">${esc(p[0])}</span><p>${withPauses(p[1])}</p></section>`).join("")}</div>
   ${key==="genu"?"":`<div class="stack" style="gap:8px"><p class="eyebrow">¿Lo mejoramos?</p><div class="ocasiones">${(key==="geno"?["Más corto","Más emotivo","Más formal","Con un toque de humor","Más sencillo de decir"]:["Más corto","Más emotivo","Más formal","Más sencillo de decir","Otro final"]).map(m=>`<button type="button" onclick="mejorarBorrador('${m}')">${m}</button>`).join("")}<button type="button" onclick="const t=document.getElementById('gen-text');t.focus();t.scrollIntoView({behavior:'smooth',block:'center'})">Otro cambio…</button></div></div>`}
   <div class="row"><button class="btn-accent" onclick="genSave('${key}')">${ICON.check}Guardar y practicar</button></div>
   <p class="muted" style="font-size:.9rem">${key==="genu"?"¿No te convence? Toca Recomendar y unir otra vez.":`¿Quieres cambios? Díselo a Claude arriba ("hazlo más corto", "cambia el final") y toca ${key==="geno"?"Armar mis palabras":d.kind==="historia"?"Armar historia":"Armar discurso"} otra vez.`}</p></div>`;
}
// Botones rápidos bajo el borrador: el pedido entra a la conversación y Claude vuelve a armarlo.
const PEDIDOS={"Más corto":"Hazlo más corto, más o menos la mitad.","Más emotivo":"Hazlo más emotivo, que toque el corazón.","Más formal":"Hazlo más formal y elegante.","Con un toque de humor":"Ponle un toque de humor suave, sin burlarte de nadie.","Más sencillo de decir":"Usa palabras más sencillas y frases más cortas, fáciles de decir en voz alta.","Otro final":"Cámbiale el final por uno más fuerte."};
function mejorarBorrador(m){
  if(genBusy)return;
  const g=genState();g.turns.push({role:"user",content:PEDIDOS[m]||m});genGuardarEstado(g);
  const c=document.getElementById("chat");if(c)c.innerHTML=chatHtml(g);
  genBuild();
}
function genErr(msg){const e=document.getElementById("gen-err");if(e){e.hidden=!msg;e.textContent=msg||""}}
let genBusy=false;
async function genSend(){
  if(genBusy)return; stopRec();
  const ta=document.getElementById("gen-text"),txt=ta.value.trim(); if(!txt)return;
  if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  const g=genState(); g.turns.push({role:"user",content:txt}); genGuardarEstado(g); vaciarDict("gen-text"); genErr("");
  const chat=document.getElementById("chat"); chat.innerHTML=chatHtml(g)+'<div class="msg cl" id="gen-live">Pensando…</div>';
  document.getElementById("gen-build").disabled=false;
  genBusy=true;
  try{
    const turns=g.turns.slice(-16);
    const M=MODOS[modoCrear()];
    const text=await IA.texto([{role:"user",content:M.rules()},{role:"assistant",content:"Entendido. "+M.saludo},...turns],{rapido:true,tarea:"conversar"});
    g.turns.push({role:"assistant",content:text}); genGuardarEstado(g);
  }catch(e){genErr(aiErr(e))}
  finally{genBusy=false;const c=document.getElementById("chat");if(c)c.innerHTML=chatHtml(genState())}
}
async function genBuild(){
  if(genBusy)return; stopRec();
  const pending=document.getElementById("gen-text").value.trim();
  const g=genState(); if(pending){g.turns.push({role:"user",content:pending});genGuardarEstado(g);vaciarDict("gen-text");document.getElementById("chat").innerHTML=chatHtml(g)}
  if(!g.turns.length){genErr("Primero cuéntale a Claude de qué quieres hablar.");return}
  if(!IA.listo()){genErr(aiErr({code:"sin_config"}));return}
  const b=document.getElementById("gen-build"); b.disabled=true; genBusy=true; genErr("");
  const esHist=modoCrear()==="historia",esOcas=modoCrear()==="ocasion";
  document.getElementById("gen-draft").innerHTML=`<div class="card"><p class="muted">Claude está escribiendo ${esOcas?"tus palabras":esHist?"tu historia":"tu discurso"}. Puede tardar hasta un minuto…</p></div>`;
  const convo=g.turns.map(t=>(t.role==="user"?"PERSONA: ":"COACH: ")+t.content).join("\n");
  const prev=g.draft?"\n\nBORRADOR ANTERIOR (aplica los cambios que la persona pidió después de él):\n"+JSON.stringify(g.draft):"";
  const prompt=esOcas?promptOcasion(convo,prev):esHist?promptHistoria(convo,prev):promptDiscurso(convo,prev);
  try{
    const d=await IA.json(prompt,{tarea:esHist?"historia":"armar"});
    const draft=limpiarBorrador(d,esHist?{kind:"historia",tipo:String(d.tipo||"Historia"),tema:"Historia",cierre:"Storytelling",nivel:2}:esOcas?{tema:String(d.tema||"Brindis"),cierre:"Storytelling",nivel:2}:{nivel:1});
    const g2=genState(); g2.draft=draft; genGuardarEstado(g2);
    document.getElementById("gen-draft").innerHTML=draftHtml(draft,MODOS[modoCrear()].key);
    document.getElementById("gen-draft").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){document.getElementById("gen-draft").innerHTML="";genErr(aiErr(e))}
  finally{genBusy=false;b.disabled=false}
}
function genSave(key){
  const g=store.get(key,{}); if(!g.draft)return;
  const sp={...g.draft,id:"m"+Date.now(),mio:true};
  delete sp.recomendacion;
  store.set("mine",[sp,...store.get("mine",[])]);
  store.set(key,{turns:[],draft:null});
  toast("Guardado en tu biblioteca"); location.hash="d-"+sp.id;
}
function genReset(b){if(!b.dataset.c){b.dataset.c=1;b.textContent="Toca otra vez para borrar la conversación";return}genGuardarEstado({turns:[],draft:null});render()}

  const todos=WARMUP.flatMap(g=>g.items).map((x,i)=>i);

const PASOS_OCULTAR=["Texto completo","Tarjetas clave","Solo cómo empieza"];
const inicioDe=t=>sinMarcas(t).replace(/\/+/g," ").trim().split(/\s+/).slice(0,4).join(" ").replace(/[,.;:!?¡¿]+$/,"")+"…";
function pistasDe(sp){return sp.tarjetas||store.get("tarjetas",{})[sp.id]||null}
async function pedirPistas(sp){
  if(!IA.listo())return null;
  const guion=sp.partes.map((p,i)=>`${i+1}. ${p[0]}: ${plain(p[1])}`).join("\n");
  const d=await IA.json(`Este es un discurso dividido en partes. Para cada parte arma una tarjeta de apoyo para decirlo sin leer:
- "claves": de 3 a 6 palabras clave o frases muy cortas (1 a 3 palabras) sacadas del texto, en el orden en que aparecen, que recuerden lo que viene (nombres, lugares, imágenes, cifras, la frase fuerte).
- "idea": la idea principal en 3 a 8 palabras.
Español sencillo.

${guion}

Responde solo con JSON: {"tarjetas":[{"claves":["...","..."],"idea":"..."}, ...]} con exactamente ${sp.partes.length} tarjetas, en el mismo orden.`,{tarea:"tarjetas"});
  const l=Array.isArray(d&&d.tarjetas)?d.tarjetas.map(t=>({claves:Array.isArray(t&&t.claves)?t.claves.map(String).slice(0,6):[],idea:String((t&&t.idea)||"")})):[];
  if(l.length!==sp.partes.length)return null;

async function grabarToggle(){
  const b=document.getElementById("e-grab"),out=document.getElementById("e-audio"),clock=document.getElementById("e-clock");
  if(!ensayo)return;
  if(ensayo.mr){ensayo.mr.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){out.hidden=false;out.innerHTML=`<p>Aquí no se puede grabar. Usa la app Android o Chrome, o la grabadora de tu teléfono.</p>`;return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){out.hidden=false;out.innerHTML=`<p>No se pudo abrir el micrófono para grabar. Si es la app Android, instala el APK más nuevo y revisa en Ajustes de Android → Apps → Escenario → Permisos que el micrófono esté permitido.</p><p class="muted" style="font-size:.85rem">Detalle: ${esc((e&&(e.name+" "+e.message))||"")}</p>`;return}
  if(!ensayo){stream.getTracks().forEach(t=>t.stop());return}
  if(ensayo.url){URL.revokeObjectURL(ensayo.url);ensayo.url=null}
  const partes=[],mr=new MediaRecorder(stream);
  ensayo.mr=mr;ensayo.stream=stream;ensayo.t0=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)partes.push(e.data)};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(ensayo&&ensayo.int);
    if(!ensayo)return;
    ensayo.mr=null;ensayo.stream=null;b.innerHTML=ICON.rec+"Grabar otra vez";b.classList.remove("rec-on");
    const secs=Math.round((Date.now()-ensayo.t0)/1000);
    const blob=new Blob(partes,{type:mr.mimeType||"audio/webm"});ensayo.url=URL.createObjectURL(blob);
    if(secs>=10)marcarPractica();
    out.hidden=false;out.innerHTML=`<p><b>Escúchate</b> (${secs} s)</p><audio controls src="${ensayo.url}"></audio>
      <p class="e-fijate">Fíjate en: ¿dices "eh" o "este" entre frases? ¿vas muy rápido? ¿haces las pausas? ¿se te cae la voz al final de las frases? Elige una sola cosa para mejorar en la próxima grabación.</p>`;
  };
  mr.start();b.innerHTML=ICON.stop+"Detener";b.classList.add("rec-on");out.hidden=true;
  ensayo.int=setInterval(()=>{const s=Math.floor((Date.now()-ensayo.t0)/1000);clock.textContent="● "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500);
}

/* ================= MULETILLAS Y VELOCIDAD EN VIVO ================= */
// Las de siempre cuentan todas; las que también sirven para unir ideas (pues, entonces, bueno…) solo si se repiten 3 veces o más.
const MULETILLAS=["o sea","osea","eh","ehh","em","emm","mmm","este este","tipo","digamos","como que","básicamente","literal","¿no?","¿cierto?","¿me entiendes?"];
const CONECTORES=["pues","entonces","bueno","este","verdad","y nada"];
function contarMuletillas(texto){
  const t=" "+texto.toLowerCase().replace(/[.,;:!¡]/g," ").replace(/\s+/g," ")+" ";
  const cuenta=w=>{const re=new RegExp("(^|\\s)"+w.replace(/[?¿]/g,m=>"\\"+m)+"(?=\\s|$)","g");return (t.match(re)||[]).length};
  const lista=[];
  MULETILLAS.forEach(w=>{const n=cuenta(w);if(n)lista.push([w,n])});
  CONECTORES.forEach(w=>{const n=cuenta(w);if(n>=3)lista.push([w,n])});
  // Palabras repetidas seguidas: "yo yo", "que que".
  const rep=(t.match(/(^|\s)([a-záéíóúñ]+) \2(?=\s)/g)||[]).filter(x=>![...MULETILLAS,...CONECTORES].includes(x.trim().split(" ")[0])).length;
  if(rep)lista.push(["palabras repetidas",rep]);
  lista.sort((a,b)=>b[1]-a[1]);
  return {total:lista.reduce((a,b)=>a+b[1],0),lista};
}
const dictT0={};
function medirVivo(id){
  const ta=document.getElementById(id),v=document.getElementById(id+"-vivo");if(!ta||!v)return;
  const txt=ta.value.trim();if(!txt){v.hidden=true;return}
  const nw=txt.split(/\s+/).length,secs=dictT0[id]?(Date.now()-dictT0[id])/1000:0,ppm=secs>=10?Math.round(nw/secs*60):null;
  const mu=contarMuletillas(txt);
  const vel=ppm==null?`<span class="muted">Midiendo velocidad…</span>`:`<b class="${ppm<110||ppm>165?"mal":ppm>=125&&ppm<=155?"bien":""}">${ppm}</b> palabras por minuto <span class="muted">(ideal 130 a 150${ppm>165?"; ve más despacio":ppm<110?"; puedes ir un poco más rápido":""})</span>`;
  const mul=mu.total?`<b class="${mu.total>=4?"mal":""}">${mu.total}</b> muletillas: ${mu.lista.slice(0,4).map(([w,n])=>`${esc(w)} ×${n}`).join(", ")}`:`<b class="bien">0</b> muletillas`;
  v.hidden=false;v.innerHTML=`<div>${vel}</div><div>${mul}</div>`;
}

function promptCalificar(contexto,dijo,datos,crits){
  const ej={};crits.forEach(c=>ej[c[0]]=4);
  return `Eres un coach de oratoria exigente pero motivador, que habla en español de México. Una persona habló en voz alta y su teléfono transcribió lo que dijo. Evalúa SOLO lo que dijo. La transcripción automática no tiene puntuación confiable: no penalices puntuación ni ortografía.

${contexto}

TRANSCRIPCIÓN DE LO QUE DIJO:
${dijo.slice(0,6000)}

DATOS: ${datos}.

Califica de 1 a 5 cada punto:
${crits.map(c=>"- "+c[0]+": "+c[1]).join("\n")}

Responde solo con JSON con esta forma:
${JSON.stringify({puntos:ej,muletillas:["este (2)"],fortaleza:"una frase concreta",mejorar:"una frase concreta citando lo que dijo",consejo:"una acción concreta para el próximo ensayo"})}`;
}
function medir(texto,t0){
  const nw=texto.split(/\s+/).filter(Boolean).length, secs=t0?Math.round((Date.now()-t0)/1000):null;
  const mu=contarMuletillas(texto),lista=mu.lista.map(([w,n])=>`"${w}" ${n}`).join(", ");
  return {nw,secs,ppm:secs?Math.round(nw/secs*60):null,txt:`${nw} palabras${secs?`, ${secs} segundos, ${Math.round(nw/secs*60)} palabras por minuto`:", sin tiempo medido"}; muletillas contadas por la app: ${mu.total}${lista?" ("+lista+")":""}`};
}
// entrada: {id, titulo, nivel, extra: {criterio: nota}} — guarda la práctica y avisa si subiste de nivel
async function calificar(out,go,prompt,m,entrada){
  if(!IA.listo()){out.innerHTML='<p class="hint">Falta conectar la IA. <a href="#ajustes">Ve a Ajustes de la IA</a>.</p>';return}
  go.disabled=true;out.innerHTML='<p class="muted">Claude está revisando lo que dijiste…</p>';
  const antes=nivelActual();
  try{
    const r=await IA.json(prompt,{tarea:"calificar"});
    const pts=Object.assign({},r&&r.puntos||{});
    const names=Object.keys(pts).filter(k=>Number(pts[k])>=1);
    if(!names.length)throw {code:"invalid_json"};
    names.forEach(k=>pts[k]=Math.min(5,Math.max(1,Math.round(Number(pts[k])))));
    const crit={};names.forEach(k=>crit[k]=pts[k]);Object.assign(crit,entrada.extra||{});
    const ks=Object.keys(crit),score=ks.reduce((a,k)=>a+crit[k],0)/ks.length;
    const h=store.get("hist",[]);
    h.unshift({id:entrada.id,titulo:entrada.titulo,nivel:entrada.nivel,date:new Date().toISOString(),kind:"ai",crit,score,secs:m.secs,note:String(r.consejo||"")});
    store.set("hist",h.slice(0,200));marcarPractica();if(entrada.id&&findSp(entrada.id))practMarcar(entrada.id,5);
    const despues=nivelActual();
    const n=entrada.nivel, faltan=Math.max(0,META-aprobadas(n));
    out.innerHTML=`${despues>antes?`<div class="levelup"><p class="eyebrow">Nuevo nivel</p><h2>Subiste al nivel ${despues}: ${nivelVista(despues).t}</h2><p>${nivelVista(despues).d}</p><button class="btn-primary" onclick="verNivel(${despues});location.hash='discursos'">Ver el nivel ${despues}</button></div>`:""}
      <div class="row" style="justify-content:space-between"><div><p class="eyebrow">Calificación de Claude</p><p class="score-big">${score.toFixed(1)}</p></div><p class="muted" style="font-size:.9rem">${m.nw} palabras${m.secs?` · ${m.secs} s · ${m.ppm} ppm`:""}</p></div>
      <div>${ks.map(k=>`<div class="pt"><span>${esc(k)}</span><b>${crit[k]}/5</b></div>`).join("")}</div>
      ${Array.isArray(r.muletillas)&&r.muletillas.length?`<p><b>Muletillas:</b> ${esc(r.muletillas.join(", "))}</p>`:""}
      <p><b>Lo que hiciste bien:</b> ${esc(r.fortaleza||"")}</p>
      <p><b>A mejorar:</b> ${esc(r.mejorar||"")}</p>
      <div class="coach"><b>Para tu próximo ensayo</b><p>${esc(r.consejo||"")}</p></div>
      <p class="muted" style="font-size:.88rem">Guardado en tu progreso.${despues>antes||n<antes?"":score>=APRUEBA?` Te ${faltan===1?"falta 1 práctica":`faltan ${faltan} prácticas`} de ${APRUEBA} o más para subir de nivel.`:` Necesitas ${APRUEBA} o más para que cuente para subir de nivel.`}</p>`;
  }catch(e){out.innerHTML=`<p class="hint" style="color:var(--bad)">${esc(aiErr(e))}</p>`}
  finally{go.disabled=false}
}

/* Cronómetro de práctica: una sola vista activa a la vez */
let cronoT0=0,cronoInt=null,cronoFin=null;
function cronoIniciar(elId,limite,alTerminar){
  cronoT0=Date.now();clearInterval(cronoInt);
  cronoInt=setInterval(()=>{
    const s=Math.floor((Date.now()-cronoT0)/1000),c=document.getElementById(elId);
    const v=limite?Math.max(0,limite-s):s;
    if(c)c.textContent=Math.floor(v/60)+":"+String(v%60).padStart(2,"0");
    if(limite&&s>=limite){clearInterval(cronoInt);cronoInt=null;try{navigator.vibrate?.(300)}catch(e){}if(alTerminar)alTerminar()}
  },250);
}
function cronoParar(){clearInterval(cronoInt);cronoInt=null}

function decir(t){return new Promise(res=>{
  const vel=parseFloat(store.get("rate",0.95))*(enGuia?gv():1);

  if(NATIVO){

    let t0=0;const fin=()=>{clearTimeout(t0);listo()};
    t0=setTimeout(()=>{if(vozCb===fin)fin()},2000+t.length*95/vel);
    vozCb=fin;
    NATIVO.hablar(JSON.stringify([{i:0,t}]),vel);return}
  if(synth&&window.SpeechSynthesisUtterance){
    synth.cancel();const u=new SpeechSynthesisUtterance(t);
    const vName=store.get("voice",""),v=voices.find(x=>x.name===vName)||voices.find(x=>/es-(MX|US|419)/i.test(x.lang))||voices[0];
    u.lang=v?v.lang:"es-MX";if(v)u.voice=v;u.rate=vel;u.onend=listo;u.onerror=listo;vozCb=listo;synth.speak(u);return;
  }
  setTimeout(res,Math.min(9000,800+t.length*60));
})}

// Pasos concretos de "gancho" y "trabalenguas", que dependen del discurso del día y de la lista de trabalenguas.
function expandir(acc,x){
  if(acc[0]==="gancho"){
    const sp=todaySpeech();return trozos(sp.partes[0][1]).map(t=>["tuTurno",t]);
  }
  if(acc[0]==="trabalenguas"){
    return (x.tw||[]).flatMap(t=>[["di","Escucha."],["di",t],["tuTurno","Ahora tú, despacio."],["di","Otra vez, más rápido."],["espera",Math.max(3000,t.split(" ").length*350),t],["di","Una vez más, rápido y claro."],["espera",Math.max(2500,t.split(" ").length*300),t]]);
  }
  return [acc];
}

const dormir=ms=>new Promise(r=>setTimeout(r,ms));
async function pausaGuia(tk){while(tk.on&&tk.pausa)await dormir(200)}
async function ejecutar(acciones,tk,x,pant){
  for(const a0 of acciones){
    for(const a of expandir(a0,x)){
      await pausaGuia(tk);if(!tk.on||tk.saltar)return;
      const [tipo,...r]=a;
      if(tipo==="di"){pant.texto(r[0]);pant.num("");await decir(r[0])}
      else if(tipo==="cuenta"){
        const [n,ms=1000]=r;
        for(let k=1;k<=n;k++){await pausaGuia(tk);if(!tk.on||tk.saltar)return;pant.num(k);await Promise.all([decir(NUMEROS[k]||String(k)),esperar(ms/gv(),tk)])}
        pant.num("");
      }
      else if(tipo==="alterna"){
        const [pal,veces,ms=1200]=r;
        for(let k=0;k<veces;k++){await pausaGuia(tk);if(!tk.on||tk.saltar)return;const w=pal[k%pal.length];pant.num(w);await Promise.all([decir(w),esperar(ms/gv(),tk)])}
        pant.num("");
      }
      else if(tipo==="espera"){if(r[1])pant.texto(r[1]);await esperar(r[0]/gv(),tk)}
      else if(tipo==="tuTurno"){pant.texto(r[0]);pant.num("");await decir(r[0]);await esperar((1500+r[0].split(/\s+/).length*450)/gv(),tk)}
      else if(tipo==="repite"){
        const [veces,bloque]=r;
        for(let k=1;k<=veces;k++){
          await pausaGuia(tk);if(!tk.on||tk.saltar)return;
          pant.rep(`${k} de ${veces}`);
          if(k>1){const t=k===veces?"La última.":"Otra vez.";pant.texto(t);await decir(t)}
          await ejecutar(bloque,tk,x,pant);
        }
        pant.rep("");
      }
    }
  }
}

async function guiaCalentar(desde,solo,lista){

  document.body.appendChild(el);history.pushState({guia:1},"");
  let wake=null;try{wake=await navigator.wakeLock?.request("screen")}catch(e){}
  const $=id=>document.getElementById(id);
  const pant={texto:t=>{const e=$("g-s");if(e)e.textContent=t},num:n=>{const e=$("g-n");if(e)e.textContent=n},rep:t=>{const e=$("g-rep");if(e)e.textContent=t?"Repetición "+t:""}};
  if(!solo)$("g-skip").onclick=()=>{tk.saltar=true;tk.pausa=false;callarGuia()};
  $("g-pausa").onclick=()=>{tk.pausa=!tk.pausa;$("g-pausa").textContent=tk.pausa?"Seguir":"Pausa";if(tk.pausa)callarGuia()};
  $("g-close").onclick=()=>guiaCerrar();
  $("g-vel").oninput=e=>store.set("gvel",e.target.value);
  enGuia=true;
  if(!solo)await decir("Vamos a calentar la cara y la voz. Ponte de pie, con los hombros sueltos y los pies a la anchura de tus hombros.");
  for(let k=ini;k<fin&&tk.on;k++){
    const x=items[k];tk.saltar=false;
    $("g-eb").textContent=`${x.g} · ${k+1} de ${items.length}`;$("g-t").textContent=x.t;pant.rep("");
    pant.texto(x.d);pant.num("");
    await decir(x.t+".");
    await ejecutar(GUIONES[x.t]||[["di",x.d],...x.steps.map(s=>["di",s])],tk,x,pant);
    if(tk.on&&!tk.saltar&&k<fin-1){pant.texto("Muy bien. Siguiente ejercicio.");pant.num("");await decir("Muy bien. Siguiente ejercicio.")}
  }
  if(tk.on){$("g-t").textContent="¡Listo!";pant.rep("");pant.num("");
    const t=solo?"Muy bien. Ejercicio terminado.":"Terminaste el calentamiento. Tu cara y tu voz están despiertas. Ahora sí, a practicar tu discurso.";
    pant.texto(t);await decir(t)}
  const completo=tk.on;if(completo&&!solo)marcarPractica();
  enGuia=false;try{wake?.release()}catch(e){}
  return completo;
}
