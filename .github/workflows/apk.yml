# Compila la app Android (carpeta android/) y la deja en
# https://github.com/tdmb102026/escenario-diario/releases/download/apk/escenario.apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: escenario-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en el enlace fijo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk escenario.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk escenario.apk --target "$GITHUB_SHA" \
            --title "App Android ${{ github.run_number }}" \
            --notes "Descarga escenario.apk en el celular y ábrelo para instalar o actualizar."
